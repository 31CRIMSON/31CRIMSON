<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#0a0608"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff1e3c" flood-opacity=".35"/>
    </filter>
    <clipPath id="c1"><rect x="30" y="72" height="30" width="0"><animate attributeName="width" begin="0.3s" dur="1.1s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420;600" keyTimes="0;.12;.24;.36;.48;.6;.72;.84;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="252" height="30" width="0"><animate attributeName="width" begin="3.2s" dur="1.1s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420;600" keyTimes="0;.12;.24;.36;.48;.6;.72;.84;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="352" height="30" width="0"><animate attributeName="width" begin="5.4s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;600" keyTimes="0;.14;.28;.42;.56;.7;.84;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="30" y="452" height="30" width="0"><animate attributeName="width" begin="7.2s" dur="0.8s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;600" keyTimes="0;.2;.4;.6;.8;1"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; font-size: 16px; white-space: pre; }
    .prompt { fill: #ff1e3c; font-weight: 700; }
    .cmd    { fill: #ffffff; }
    .key    { fill: #ff7a8a; }
    .val    { fill: #d9d9de; }
    .dim    { fill: #6b6b75; }
    .ok     { fill: #3ddc84; }
    .warn   { fill: #ffb020; }
    .ln     { opacity: 0; animation: show .01s forwards; }
    .blink  { animation: blink 1s steps(1) infinite; }
    @keyframes show  { to { opacity: 1; } }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  </style>

  <rect x="10" y="10" width="880" height="560" rx="14" fill="url(#win)" stroke="#ff1e3c" stroke-opacity=".45" filter="url(#soft)"/>
  <path d="M10 50V24a14 14 0 0 1 14-14h852a14 14 0 0 1 14 14v26z" fill="#16090d"/>
  <circle cx="38" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="62" cy="30" r="7" fill="#febc2e"/>
  <circle cx="86" cy="30" r="7" fill="#28c840"/>
  <text x="450" y="35" text-anchor="middle" class="dim" style="font-size:13px">crimson@prod-cluster: ~ — zsh</text>

  <!-- 1. kubectl -->
  <text x="34" y="92" clip-path="url(#c1)"><tspan class="prompt">❯ </tspan><tspan class="cmd">kubectl get pods -n 31crimson</tspan></text>
  <text x="34" y="124" class="ln dim" style="animation-delay:1.5s">NAME                 READY   STATUS             RESTARTS   AGE</text>
  <text x="34" y="150" class="ln" style="animation-delay:1.7s"><tspan class="val">devops-engineer      1/1     </tspan><tspan class="ok">Running</tspan><tspan class="val">            0          ∞</tspan></text>
  <text x="34" y="176" class="ln" style="animation-delay:1.9s"><tspan class="val">backend-developer    1/1     </tspan><tspan class="ok">Running</tspan><tspan class="val">            0          ∞</tspan></text>
  <text x="34" y="202" class="ln" style="animation-delay:2.1s"><tspan class="val">cloud-engineer       1/1     </tspan><tspan class="ok">Running</tspan><tspan class="val">            0          ∞</tspan></text>
  <text x="34" y="228" class="ln" style="animation-delay:2.3s"><tspan class="val">legacy-monolith      0/1     </tspan><tspan class="prompt">CrashLoopBackOff</tspan><tspan class="val">   418        </tspan><tspan class="dim">2014</tspan></text>

  <!-- 2. terraform -->
  <text x="34" y="272" clip-path="url(#c2)"><tspan class="prompt">❯ </tspan><tspan class="cmd">terraform plan -target=module.career</tspan></text>
  <text x="34" y="302" class="ln" style="animation-delay:4.4s"><tspan class="ok">  + </tspan><tspan class="val">ci_cd_pipelines   </tspan><tspan class="ok">+ </tspan><tspan class="val">observability   </tspan><tspan class="warn">~ </tspan><tspan class="val">legacy_code</tspan><tspan class="dim">   # forces replacement</tspan></text>
  <text x="34" y="328" class="ln" style="animation-delay:4.7s"><tspan class="val">Plan: </tspan><tspan class="ok">2 to add</tspan><tspan class="val">, </tspan><tspan class="warn">1 to change</tspan><tspan class="val">, </tspan><tspan class="prompt">0 to destroy</tspan><tspan class="dim">  (prod is sacred)</tspan></text>

  <!-- 3. healthcheck -->
  <text x="34" y="372" clip-path="url(#c3)"><tspan class="prompt">❯ </tspan><tspan class="cmd">./healthcheck --prod</tspan></text>
  <text x="34" y="402" class="ln" style="animation-delay:6.4s"><tspan class="ok">● all systems operational</tspan><tspan class="dim">  ·  </tspan><tspan class="key">p99 </tspan><tspan class="val">42ms</tspan><tspan class="dim">  ·  </tspan><tspan class="key">last RCA: </tspan><tspan class="val">it was DNS</tspan></text>
  <text x="34" y="428" class="ln" style="animation-delay:6.7s"><tspan class="dim">  warn: </tspan><tspan class="val">works on my cluster</tspan><tspan class="dim"> — shipping the cluster</tspan></text>

  <!-- 4. status -->
  <text x="34" y="472" clip-path="url(#c4)"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat status.yaml</tspan></text>
  <text x="34" y="502" class="ln" style="animation-delay:8.1s"><tspan class="key">status: </tspan><tspan class="ok">available for freelance &amp; interesting projects</tspan></text>

  <text x="34" y="542" class="ln" style="animation-delay:8.5s"><tspan class="prompt">❯ </tspan><tspan class="prompt blink">▌</tspan></text>
</svg>
